AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless nanoservice using S3, Lambda, and SES
Parameters:
  EmailFrom:
    Type: String
    Description: Must be a SES verified identity
  EmailTo:
    Type: String
    Description: Recipient email address (must be SES verified while the account is in the SES sandbox)
  LogRetentionInDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: Number of days to retain Lambda function logs
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    MemorySize: 128
    Environment:
      Variables:
        EMAIL_FROM: !Ref EmailFrom
        EMAIL_TO: !Ref EmailTo
Metadata:
  AWS::ServerlessRepo::Application:
    Name: nanoservice-s3-lambda-ses
    Description: Serverless nanoservice using S3, Lambda, and SES. The Node.js Lambda service is triggered by S3 object creation and sends emails.
    Author: Bernd Straehle
    Labels: ['serverless', 'sam', 's3', 'lambda', 'ses', 'nodejs']
    SpdxLicenseId: Apache-2.0
    LicenseUrl: LICENSE
    ReadmeUrl: README-SAR.md
    HomePageUrl: https://github.com/bstraehle
    SemanticVersion: 2.0.0
    SourceCodeUrl: https://github.com/bstraehle/aws-s3-lambda-ses
Resources:
  myLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: .
      Description: Serverless nanoservice using S3, Lambda, and SES
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref myLogGroup
      Policies:
        - SESCrudPolicy:
            IdentityName: !Ref EmailFrom
      Events:
        S3BucketEvent:
          Type: S3
          Properties:
            Bucket: !Ref myS3Bucket
            Events: s3:ObjectCreated:*
  myLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionInDays
  myS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
Outputs:
  BucketName:
    Description: S3 bucket that triggers the function on object creation
    Value: !Ref myS3Bucket
  FunctionName:
    Description: Lambda function name
    Value: !Ref myLambdaFunction
